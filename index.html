<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jason Fan</title>
  <style>
    :root {
      --bg: #f7f7f9;
      --text: #1f2430;
      --accent: #2b6cb0;
      --card-bg: #ffffff;
      --border: #d9dce3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background-color: var(--accent);
      color: #fff;
      padding: 2rem 1rem;
      text-align: center;
    }

    header h1 {
      margin: 0 0 0.5rem 0;
      font-size: 2rem;
    }

    header p {
      margin: 0;
      font-size: 1.1rem;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    section {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    section h2 {
      margin-top: 0;
      color: var(--accent);
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    nav ul li {
      margin-bottom: 0.75rem;
    }

    nav a {
      display: inline-block;
      text-decoration: none;
      color: var(--accent);
      font-weight: 600;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--accent);
      border-radius: 6px;
      width: 100%;
    }

    nav a:hover,
    nav a:focus {
      background-color: var(--accent);
      color: #fff;
    }

    footer {
      text-align: center;
      padding: 1.5rem 1rem;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>Jason Fan</h1>
    <p>CSCI 3150 Portal</p>
  </header>

  <main>
    <section aria-labelledby="about-heading">
      <h2 id="about-heading">About Me</h2>
      <p>
        Hi, I'm Jason Fan. I'm currently a computer science student at CU Boulder.
      </p>
    </section>

    <section aria-labelledby="assignments-heading">
      <h2 id="assignments-heading">My Assignments</h2>
      <nav aria-label="Assignment links">
        <ul>
          <li><a href="assignment1.html">Assignment 1 </a></li>
          <li><a href="assignment2.html">Assignment 2 </a></li>
          <li><a href="assignment3.html">Assignment 3 </a></li>
        </ul>
      </nav>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Jason Fan</p>
  </footer>

</body>
</html>
